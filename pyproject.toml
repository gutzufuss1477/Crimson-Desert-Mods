[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crimson-desert-mod-tools"
version = "1.0.0"
description = "Semantic builders and validators for a Crimson Desert mod collection"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Blablup"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.4,<10"]

[project.scripts]
crimson-mods = "crimson_mod_tools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

