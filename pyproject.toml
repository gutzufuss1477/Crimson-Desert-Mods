[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "crimson-desert-mods-dmm"
version = "2.0.0"
description = "DMM-only reproducible builders for Crimson Desert mods"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
