name: Validate repository

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

  mining-native:
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Build and test the material-only Mining Helmet ASI
        shell: cmd
        run: mods\mining-helmet-always-on\src\build.cmd
      - name: Verify refusal outside the game
        shell: pwsh
        run: |
          $status = Get-Content "$env:LOCALAPPDATA\MiningHelmetAlwaysOn\MH110\smoke\latest-status.txt" -Raw
          if ($status -notmatch 'Status: wrong_process' -or $status -notmatch 'Ready: no' -or $status -notmatch 'ON calls: 0') {
            throw "ASI did not confirm the expected wrong-process refusal."
          }
