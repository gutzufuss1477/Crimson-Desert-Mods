name: Game update blocked a mod
about: Record a failed semantic rebuild after a Crimson Desert update
title: '[Update] '
labels: ['game-update', 'build-blocked']
body:
  - type: input
    id: version
    attributes:
      label: Game version
      placeholder: 1.17
    validations:
      required: true
  - type: dropdown
    id: mod
    attributes:
      label: Blocked group
      options:
        - mounts
        - steelheart
        - alden
        - healthbars
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: BUILD_REPORT error
      description: Paste only the relevant error. Do not attach clean game files.
    validations:
      required: true
  - type: textarea
    id: observations
    attributes:
      label: Additional observations
