[BankRefresh]
; 1 = enabled, 0 = disabled. Restart the game after changing this file.
Enabled=1

; Refresh deadline in IN-GAME minutes, not real-world minutes.
; Default: 15. Allowed range: 1 to 4320 (whole numbers only).
; Examples: 30 = half an in-game hour, 60 = one in-game hour,
; 360 = six in-game hours, 1440 = one in-game day.
IntervalGameMinutes=15

; Day/night transitions are handled using the game's calendar.
; The bank only processes expired deadlines on its normal update check
; (about once per real-world minute in testing). "Updating" may therefore
; remain visible briefly after the countdown reaches zero.
; An existing shorter countdown is not extended. A longer setting takes
; effect after that shorter cycle has finished.
; This release does not create diagnostic logs.
